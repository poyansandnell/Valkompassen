kind = "web"
previewPath = "/"
title = "Valkompass"
version = "1.0.0"
id = "artifacts/valkompass"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26109

[services.development]
run = "pnpm --filter @workspace/valkompass run dev"

[services.production]

[services.production.build]
args = [ "pnpm", "--filter", "@workspace/valkompass", "run", "build" ]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = [ "node", "artifacts/valkompass/server/index.mjs" ]

[services.production.run.env]
PORT = "26109"
NODE_ENV = "production"

[services.env]
PORT = "26109"
BASE_PATH = "/"
