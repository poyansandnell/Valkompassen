kind = "mobile"
previewPath = "/mobil/"
title = "Valkompass Mobil"
version = "1.0.0"
id = "artifacts/valkompass-mobil"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobil/" ]
localPort = 20906

[services.development]
run = "pnpm --filter @workspace/valkompass-mobil run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/valkompass-mobil", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/valkompass-mobil", "run", "serve" ]

[services.env]
PORT = "20906"
BASE_PATH = "/mobil/"
